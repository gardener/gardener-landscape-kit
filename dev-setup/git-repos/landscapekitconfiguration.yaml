apiVersion: landscape.config.gardener.cloud/v1alpha1
kind: LandscapeKitConfiguration
# ocm:
#   repositories:
#   - <repo-url>
#   rootComponent:
#     name: <component-name>
#     version: <component-version>
#   originalRefs: true
repositories:
  base:
    componentsFiles:
    - components.yaml
    # TODO(LucaBernstein): Remove once the first distroless Flux controller images have been built and pushed
    # (flux-distroless-rebuild.yaml ran on main and Renovate pinned real -glk.<sha>@sha256:<digest> refs into
    # componentvector/components.yaml). Until then this file overrides the bootstrap -glk.0 tags with the
    # pullable upstream ghcr.io/fluxcd refs so e2e clusters can pull the controller images.
    - components-flux-upstream-override.yaml
  landscape:
    ref:
      # branch: main
      tag: main
    baseLink: ./base
    kind: OCIRepository
    url: oci://glk-registry.local.gardener.cloud:6001/landscape
    # url: http://gitops:testtest@git.local.gardener.cloud:6080/gitops/test-landscape.git
components:
- name: flux
- name: github
