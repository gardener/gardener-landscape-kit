name: Prepare Next Dev Cycle

on:
  workflow_dispatch:
    inputs:
      next-version:
        type: choice
        options:
          - bump-minor
        default: bump-minor
        description: 'Select the type of version bump for the next dev cycle.'

permissions:
  contents: read

jobs:
  bump-dev-release:
    name: Bump Version and Open PR
    if: ${{ github.repository == 'gardener/gardener-landscape-kit' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The federation service must authorize this workflow to use the GitHub App.
      - name: Authenticate with GitHub App
        id: github-auth
        uses: gardener/cc-utils/.github/actions/github-auth@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0
        with:
          token-server: ${{ vars.FEDERATED_GITHUB_ACCESS_TOKEN_SERVER }}
          repositories: ${{ github.event.repository.name }}
          permissions: |
            contents: write
            pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.github-auth.outputs.token }}

      - name: Set up git identity
        uses: gardener/cc-utils/.github/actions/setup-git-identity@d478850afa1a7e0f9deb710e4d44eb0a2d8dce07 # 1.2881.0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Compute new version
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(cat pkg/utils/version/VERSION | tr -d '[:space:]')"
          # Strip any -dev or pre-release suffix to get the release base
          BASE="${CURRENT%%-*}"
          MAJOR="$(echo "${BASE}" | cut -d. -f1 | tr -d 'v')"
          MINOR="$(echo "${BASE}" | cut -d. -f2)"
          PATCH="$(echo "${BASE}" | cut -d. -f3)"
          if [[ "${{ inputs.next-version }}" == "bump-minor" ]]; then
            MINOR="$((MINOR + 1))"
            PATCH=0
          else
            PATCH="$((PATCH + 1))"
          fi
          NEXT="v${MAJOR}.${MINOR}.${PATCH}-dev"
          echo "current=${CURRENT}" >> "${GITHUB_OUTPUT}"
          echo "next=${NEXT}" >> "${GITHUB_OUTPUT}"

      - name: Write new VERSION
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.version.outputs.next }}" > pkg/utils/version/VERSION

      - name: Run make generate
        run: |
          set -euo pipefail
          export PATH="${PATH}:$(go env GOROOT)/bin"
          make generate

      - name: Create branch and push
        id: push
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          BRANCH="prepare-dev-cycle-${NEXT}"
          git checkout -b "${BRANCH}"
          git add pkg/utils/version/VERSION componentvector/components.yaml
          git commit --signoff -m "Prepare next Dev Cycle \`${NEXT}\`"$'\n\n'"[make generate]"
          if git fetch origin "refs/heads/${BRANCH}"; then
            # A previous run may have pushed the branch before PR creation failed.
            # Reuse it only if the version-bump files match; never overwrite it.
            if ! git diff --quiet HEAD FETCH_HEAD -- pkg/utils/version/VERSION componentvector/components.yaml; then
              echo "::error::Branch ${BRANCH} already exists with different version-bump files."
              exit 1
            fi
          else
            git push origin "HEAD:${BRANCH}"
          fi
          echo "branch=${BRANCH}" >> "${GITHUB_OUTPUT}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ steps.github-auth.outputs.token }}
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
          BRANCH: ${{ steps.push.outputs.branch }}
          PR_BODY: |
            <!-- Please ensure that you do not include company internal information. -->

            **How to categorize this PR?**
            /area delivery
            /kind enhancement

            **What this PR does / why we need it**:
            Prepares the next dev cycle by bumping the version from `${{ steps.version.outputs.current }}` to `${{ steps.version.outputs.next }}`.

            **Which issue(s) this PR fixes**:
            Fixes #

            **Special notes for your reviewer**:

            **Release note**:
            ```other operator
            NONE
            ```
        run: |
          set -euo pipefail
          gh pr create \
            --title "Prepare next Dev Cycle \`${NEXT}\`" \
            --head "${BRANCH}" \
            --base main \
            --body "${PR_BODY}"
